{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="card error-card">
    <h1>⚠ Error {{ code }}</h1>
    <p class="error-message">{{ message }}</p>
    <div class="actions">
        <a href="{{ url_for('main.index') }}" class="btn-secondary">← Back to Home</a>
    </div>
</div>
{% endblock %}
